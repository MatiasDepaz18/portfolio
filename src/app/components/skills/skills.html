<app-section-shell
  id="skills"
  eyebrow="Power-Ups"
  title="Habilidades"
  lede="Lo que uso para construir, ordenado por categoría. Cada power-up tiene su nota al hover."
>
  <div class="skills-grid">
    @for (cat of categories; track cat.id) {
      <article class="tray" appReveal [appRevealDelay]="$index * 80">
        <header class="tray-head">
          <span class="tray-item" aria-hidden="true">
            <ng-icon [name]="cat.icon" class="tray-icon" />
          </span>
          <div>
            <h3 class="tray-title">{{ cat.label }}</h3>
            <p class="tray-tagline">{{ cat.tagline }}</p>
          </div>
        </header>

        <ul class="tray-skills">
          @for (skill of cat.skills; track skill.name) {
            <li class="skill-chip">
              @if (skill.logo) {
                <img
                  [src]="logoUrl(skill.logo)"
                  [alt]="skill.name"
                  class="skill-logo"
                  width="20"
                  height="20"
                  loading="lazy"
                />
              } @else {
                <ng-icon [name]="skill.icon ?? ''" class="skill-glyph" />
              }
              <span class="skill-name">{{ skill.name }}</span>
              <span class="skill-note">{{ skill.note }}</span>
            </li>
          }
        </ul>
      </article>
    }
  </div>
</app-section-shell>
