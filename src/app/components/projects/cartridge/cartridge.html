<article class="cart cart-{{ project().colorway }} {{ rotateClass(index()) }}">
  <!-- Etiqueta -->
  <div class="cart-label pixel-corners">
    <div class="cart-label-top">
      <span class="cart-brand">MATIAS DEPAZ</span>
      @if (project().status) {
        <app-badge [variant]="project().status === 'SHIPPED' ? 'accent' : 'gold'">
          {{ project().status }}
        </app-badge>
      }
    </div>

    <!-- Pantalla de título (abstracta, no es un screenshot) -->
    <div class="cart-screen" aria-hidden="true">
      <p class="cart-screen-title">{{ project().title }}<span class="cart-cursor">_</span></p>
      <div class="cart-screen-divider"></div>
      <p class="cart-screen-stack">{{ project().stack.join(' · ') }}</p>
    </div>
  </div>

  <!-- Cuerpo -->
  <div class="cart-body">
    <h3 class="cart-title">{{ project().title }}</h3>
    <p class="cart-desc">{{ project().description }}</p>

    <dl class="cart-facts">
      <div class="cart-fact">
        <dt class="cart-fact-label">Problema</dt>
        <dd class="cart-fact-text">{{ project().problem }}</dd>
      </div>
      <div class="cart-fact">
        <dt class="cart-fact-label">Solución</dt>
        <dd class="cart-fact-text">{{ project().solution }}</dd>
      </div>
    </dl>

    <div class="cart-actions">
      <app-game-button variant="ghost" [href]="project().repoUrl" [external]="true">
        <ng-icon name="phosphorGithubLogo" />
        Código
      </app-game-button>
      @if (project().demoUrl) {
        <app-game-button [href]="project().demoUrl" [external]="true">
          Demo
          <ng-icon name="phosphorArrowUpRight" />
        </app-game-button>
      }
    </div>
  </div>

  <!-- Conector inferior -->
  <div class="cart-connector" aria-hidden="true"></div>
</article>
