<app-section-shell
  id="projects"
  title="Proyectos"
  lede="Cada proyecto es un cartucho con su historia, su código y su demo."
>
  <div class="projects-grid">
    @for (project of projects; track project.title) {
      <app-cartridge
        [project]="project"
        [index]="$index"
        appReveal
        [appRevealDelay]="$index * 110"
      />
    }

    <!-- Slot vacío: próximo cartucho -->
    <article class="cart-slot" appReveal [appRevealDelay]="projects.length * 110">
      <div class="cart-slot-label pixel-corners">
        <p class="cart-slot-pixel">PRÓXIMO NIVEL</p>
        <p class="cart-slot-text">
          Tu próximo proyecto puede vivir acá. Agregalo en
          <code>src/app/data/projects.data.ts</code>.
        </p>
      </div>
      <div class="cart-slot-action">
        <app-game-button variant="ghost" [href]="github" [external]="true">
          <ng-icon name="phosphorGithubLogo" />
          Ver GitHub
        </app-game-button>
      </div>
    </article>
  </div>
</app-section-shell>
