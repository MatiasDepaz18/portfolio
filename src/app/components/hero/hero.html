<section id="hero" class="hero">
  <div class="hero-bg pixel-grid" aria-hidden="true"></div>

  <app-hero-yoshi />

  <div class="hero-curtain" aria-hidden="true"></div>

  <div class="hero-grid">
    <!-- Columna de texto -->
    <div class="hero-copy">
      <p class="hero-eyebrow hero-rise" style="--i: 60ms">Software &amp; AI Engineer</p>

      <h1 class="hero-title hero-rise" style="--i: 150ms">
        Matías Depaz<span class="hero-cursor" aria-hidden="true">_</span>
      </h1>

      <p class="hero-sub hero-rise" style="--i: 260ms">
        Ingeniero en Computación. Construyo software, datos e inteligencia artificial con foco en
        calidad y experiencia de usuario.
      </p>

      <div class="hero-ctas hero-rise" style="--i: 380ms">
        <app-game-button (click)="scrollTo('projects')">
          Ver proyectos
        </app-game-button>
        <app-game-button (click)="scrollTo('contact')"> Contacto </app-game-button>
      </div>
    </div>

    <!-- Columna visual: frame de consola -->
    <div class="hero-visual hero-rise" style="--i: 220ms">
      <div class="hero-frame">
        <div class="hero-frame-strip" aria-hidden="true">MATIAS DEPAZ</div>
        <img
          class="hero-frame-img"
          src="PhotoWhitPoster.webp"
          alt="Matías Depaz frente a su computadora"
          width="900"
          height="1125"
        />
        <div class="hero-frame-controls" aria-hidden="true">
          <div class="hero-dpad">
            <span class="hero-dpad-v"></span>
            <span class="hero-dpad-h"></span>
          </div>
          <div class="hero-btns">
            <span class="hero-btn hero-btn-a"></span>
            <span class="hero-btn hero-btn-b"></span>
          </div>
        </div>
      </div>

      <!-- Bloque "?" -->
      <div class="hero-block">
        <button
          class="hero-block-btn pixel-corners"
          (click)="toggleTip()"
          [attr.aria-expanded]="tipOpen()"
          aria-controls="hero-tip"
          aria-label="Mostrar tip sobre la tecnología del sitio"
        >
          ?
        </button>
        @if (tipOpen()) {
          <div id="hero-tip" class="hero-tip">
            <p class="hero-tip-label">TIP</p>
            <p class="hero-tip-text">
              Este sitio corre con Angular 21, SSR y GSAP. Sin plantillas.
            </p>
          </div>
        }
      </div>
    </div>
  </div>
</section>
