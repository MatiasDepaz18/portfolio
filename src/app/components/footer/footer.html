<footer class="footer">
  <div class="footer-inner">
    <div class="footer-top">
      <p class="footer-name">
        <span class="footer-mark pixel-corners" aria-hidden="true">MD</span>
        {{ site.name }}
      </p>

      <nav class="footer-nav" aria-label="Navegación del pie">
        <ul>
          @for (link of links; track link.id) {
            <li>
              <button (click)="scrollTo(link.id)">{{ link.label }}</button>
            </li>
          }
        </ul>
      </nav>

      <div class="footer-socials">
        <a [href]="site.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <ng-icon name="phosphorGithubLogo" />
        </a>
        <a [href]="site.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <ng-icon name="phosphorLinkedinLogo" />
        </a>
        <a [href]="'mailto:' + site.email" aria-label="Email">
          <ng-icon name="phosphorEnvelopeSimple" />
        </a>
      </div>
    </div>

    <div class="footer-bottom">
      <p class="footer-copy">
        &copy; {{ currentYear }} {{ site.name }}. Todos los derechos reservados.
      </p>
      <p class="footer-complete">LEVEL COMPLETE</p>
      <p class="footer-stack">Hecho con Angular, TypeScript y GSAP</p>
    </div>
  </div>
</footer>
