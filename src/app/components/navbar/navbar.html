<nav [class.nav-solid]="isScrolled()" class="nav" aria-label="Navegación principal">
  <div class="nav-inner">
    <!-- Logo -->
    <button (click)="scrollTo('hero')" class="nav-logo" aria-label="Ir al inicio">
      <span class="nav-logo-mark pixel-corners" aria-hidden="true">MD</span>
      <span class="nav-logo-name">Matías Depaz</span>
    </button>

    <!-- Links desktop -->
    <ul class="nav-links">
      @for (link of links; track link.id) {
        <li>
          <button
            (click)="scrollTo(link.id)"
            class="nav-link"
            [class.nav-link-active]="activeId() === link.id"
            [attr.aria-current]="activeId() === link.id ? 'true' : null"
          >
            {{ link.label }}
          </button>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <!-- Toggle tema -->
      <button
        (click)="toggleTheme()"
        class="nav-icon-btn"
        [attr.aria-label]="theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        @if (theme() === 'dark') {
          <ng-icon name="phosphorSun" />
        } @else {
          <ng-icon name="phosphorMoon" />
        }
      </button>

      <!-- Hamburguesa -->
      <button
        (click)="toggleMenu()"
        class="nav-icon-btn md:hidden"
        [attr.aria-label]="isMenuOpen() ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="isMenuOpen()"
      >
        @if (!isMenuOpen()) {
          <ng-icon name="phosphorList" />
        } @else {
          <ng-icon name="phosphorX" />
        }
      </button>
    </div>
  </div>

  <!-- Menú móvil -->
  @if (isMenuOpen()) {
    <div class="nav-mobile">
      <ul>
        @for (link of links; track link.id) {
          <li>
            <button
              (click)="scrollTo(link.id)"
              class="nav-mobile-link"
              [class.nav-link-active]="activeId() === link.id"
            >
              {{ link.label }}
            </button>
          </li>
        }
      </ul>
    </div>
  }
</nav>
